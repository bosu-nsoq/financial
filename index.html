<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  
  <!-- ชื่อบน Tab -->
  <title>Financial</title>

  <!-- คำบรรยายและรูปภาพสำหรับแสดงผลเวลาแชร์ลิงก์ใน LINE / Facebook (Open Graph Meta Tags) -->
  <meta name="description" content="ระบบบันทึกการใช้เงิน">
  <meta property="og:title" content="Financial">
  <meta property="og:description" content="ระบบบันทึกการใช้เงิน">
  <meta property="og:image" content="https://i.postimg.cc/T2Cngdnd/Financial.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://bosu-nsoq.github.io/financial/">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Financial">
  <meta name="twitter:description" content="ระบบบันทึกการใช้เงิน">
  <meta name="twitter:image" content="https://i.postimg.cc/T2Cngdnd/Financial.png">

  <!-- Favicon (ไอคอนบน Tab) -->
  <link rel="icon" type="image/png" href="https://i.postimg.cc/T2Cngdnd/Financial.png">
  <link rel="shortcut icon" type="image/png" href="https://i.postimg.cc/T2Cngdnd/Financial.png">

  <!-- PWA & Apple iOS Standalone App Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FF9A9E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="บันทึกการใช้เงิน">
  <link rel="apple-touch-icon" href="https://i.postimg.cc/T2Cngdnd/Financial.png">
  <link rel="apple-touch-icon" sizes="152x152" href="https://i.postimg.cc/T2Cngdnd/Financial.png">
  <link rel="apple-touch-icon" sizes="167x167" href="https://i.postimg.cc/T2Cngdnd/Financial.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://i.postimg.cc/T2Cngdnd/Financial.png">

  <!-- โหลดฟอนต์ Mali สำหรับ UI และ Sarabun สำหรับพิมพ์รายงาน -->
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * { 
      box-sizing: border-box; 
      font-family: 'Mali', cursive, sans-serif; 
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      margin: 0; 
      padding: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden; /* ล็อกหน้าจอแนวตั้งไม่ให้เลื่อนตามสั่ง */
      background: linear-gradient(45deg, #FF9A9E, #FECFEF, #F6D365, #FDA085);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      display: flex; 
      justify-content: center; 
      color: #333;
    }
    
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    /* Layout Container ให้พอดีจอ 1 หน้าจอเต็ม */
    .app-container { 
      width: 100%; 
      max-width: 440px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom)) 10px;
    }

    /* Single-line Header เฉพาะหัวข้อ (เอาไอคอน 4 ปุ่มออกไปไว้ด้านล่างแล้ว) */
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 0 6px 0;
      flex-shrink: 0;
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-logo {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }
    .header-title {
      margin: 0;
      color: #d63384;
      font-size: 19px;
      font-weight: 700;
      text-shadow: 1px 1px 3px rgba(255,255,255,0.9);
      white-space: nowrap;
    }

    /* การ์ดกระจกฝ้า Main Card */
    .glass {
      background: rgba(255, 255, 255, 0.45); 
      backdrop-filter: blur(16px); 
      -webkit-backdrop-filter: blur(16px);
      border-radius: 18px; 
      border: 1px solid rgba(255, 255, 255, 0.65);
      box-shadow: 0 8px 30px 0 rgba(31, 38, 135, 0.12);
      padding: 12px 14px; 
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      min-height: 0;
      margin-bottom: 8px;
    }

    /* Form Fields Styling */
    .form-group { 
      margin-bottom: 5px; 
    }
    .field-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3px;
    }
    label { 
      margin: 0;
      font-size: 13px; 
      font-weight: 600; 
      color: #5a2e5d;
    }
    
    .btn-icon-mini {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(214, 51, 132, 0.3);
      color: #d63384;
      border-radius: 16px;
      padding: 1px 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }
    .btn-icon-mini:active {
      transform: scale(0.94);
      background: #d63384;
      color: white;
    }

    /* แถบปุ่ม Chips เลื่อนแนวนอนบรรทัดเดียว ไม่กินพื้นที่ */
    .chips-container-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      padding: 2px 1px;
      scrollbar-width: none; /* ซ่อน scrollbar */
      -ms-overflow-style: none;
    }
    .chips-container-row::-webkit-scrollbar {
      display: none;
    }
    .chip-btn {
      padding: 6px 13px;
      border-radius: 16px;
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      background: rgba(255, 255, 255, 0.75);
      color: #5a2e5d;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
      box-shadow: 0 1px 4px rgba(0,0,0,0.03);
    }
    .chip-btn:active {
      transform: scale(0.95);
    }
    .chip-btn.active {
      background: #d63384;
      color: #ffffff;
      border-color: #d63384;
      box-shadow: 0 3px 10px rgba(214, 51, 132, 0.35);
      transform: scale(1.02);
    }

    /* Inputs */
    input {
      width: 100%; 
      padding: 8px 11px; 
      border-radius: 11px; 
      border: 1.5px solid rgba(255,255,255,0.7);
      background: rgba(255,255,255,0.85); 
      font-size: 14.5px; 
      outline: none; 
      color: #333; 
      font-weight: 500;
    }
    input:focus { 
      background: #fff; 
      border-color: #ff6b6b; 
    }

    /* Date Picker Overlay */
    .date-picker-wrap {
      position: relative; 
      display: flex; 
      align-items: center;
      width: 100%;
    }
    #dateRaw {
      position: absolute; 
      inset: 0; 
      width: 100%; 
      height: 100%; 
      opacity: 0; 
      cursor: pointer;
    }
    #dateRaw::-webkit-calendar-picker-indicator {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer;
    }
    
    .btn {
      width: 100%; 
      padding: 10px; 
      border-radius: 12px; 
      border: none;
      font-size: 14.5px; 
      font-weight: 700; 
      cursor: pointer; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      gap: 5px;
      transition: transform 0.15s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-deposit { 
      background: #1dd1a1; 
      color: white; 
      box-shadow: 0 3px 12px rgba(29, 209, 161, 0.35); 
    }
    .btn-withdraw { 
      background: #ff6b6b; 
      color: white; 
      box-shadow: 0 3px 12px rgba(255, 107, 107, 0.35); 
    }
    .action-row { display: flex; gap: 8px; margin-top: 4px; }

    /* แถบปุ่มด้านล่างสุด (Bottom Dock - ย้ายมาจากหัวเว็บ) */
    .bottom-dock {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      padding: 6px 12px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      flex-shrink: 0;
    }
    .dock-btn {
      background: transparent;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      padding: 4px 12px;
      border-radius: 10px;
      transition: background 0.15s;
    }
    .dock-btn:active {
      background: rgba(255,255,255,0.8);
      transform: scale(0.95);
    }
    .dock-icon {
      font-size: 19px;
      line-height: 1;
    }
    .dock-label {
      font-size: 11px;
      font-weight: 600;
      color: #5a2e5d;
    }

    #loader { 
      display: none; 
      text-align: center; 
      font-weight: bold; 
      color: white; 
      margin-bottom: 6px; 
      background: rgba(0,0,0,0.5); 
      padding: 6px; 
      border-radius: 10px;
      font-size: 12px;
    }

    /* Modal Styling */
    .modal {
      display: none; 
      position: fixed; 
      z-index: 100; 
      left: 0; top: 0;
      width: 100%; height: 100%; 
      background-color: rgba(0,0,0,0.45);
      backdrop-filter: blur(6px); 
      -webkit-backdrop-filter: blur(6px);
      overflow-y: auto; 
      padding: 20px 10px;
    }
    .modal-content {
      background: rgba(255, 255, 255, 0.85); 
      backdrop-filter: blur(20px); 
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px; 
      border: 1px solid rgba(255,255,255,0.9);
      margin: 10px auto; 
      width: 100%; 
      max-width: 440px; 
      padding: 16px;
      position: relative; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .close-btn {
      position: absolute; right: 14px; top: 14px; 
      font-size: 24px; font-weight: bold;
      color: #ff6b6b; cursor: pointer; line-height: 1;
    }
    .transaction-item {
      background: rgba(255,255,255,0.85); 
      border-radius: 11px; 
      padding: 8px 10px; 
      margin-bottom: 8px;
      display: flex; justify-content: space-between; align-items: center; 
      border: 1px solid rgba(255,255,255,0.9);
    }
    .t-info { font-size: 12px; color: #444; }
    .t-amount { font-weight: 700; font-size: 14.5px; }
    .t-deposit { color: #10ac84; }
    .t-withdraw { color: #ee5253; }
    .balance-box {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255,255,255,0.85); border-radius: 11px; 
      padding: 8px 10px; margin-bottom: 7px;
      border: 1px solid rgba(255,255,255,0.9);
    }
    .balance-name { font-weight: 600; color: #5a2e5d; font-size: 13.5px; }
    .balance-amount { font-size: 14px; font-weight: bold; color: #d63384; margin: 0 8px; }

    /* ================= PIN LOCK SCREEN ================= */
    #pinOverlay {
      position: fixed; inset: 0; z-index: 9999;
      background: linear-gradient(135deg, rgba(255,154,158,0.96), rgba(254,207,239,0.96));
      backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px;
    }
    .pin-card {
      background: rgba(255,255,255,0.7); border-radius: 24px;
      padding: 24px 18px; width: 100%; max-width: 320px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.12); text-align: center;
      border: 1px solid rgba(255,255,255,0.85);
    }
    .pin-dot {
      width: 14px; height: 14px; border-radius: 50%;
      border: 2px solid #d63384; background: transparent;
      transition: background 0.15s, transform 0.15s;
    }
    .pin-dot.filled { background: #d63384; transform: scale(1.15); }
    .pin-keypad {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 10px; max-width: 240px; margin: 0 auto;
    }
    .pin-key {
      aspect-ratio: 1; border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.85);
      background: rgba(255,255,255,0.85); color: #5a2e5d;
      font-size: 20px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .pin-key:active { transform: scale(0.9); background: #d63384; color: white; }
    .pin-key.pin-tool { font-size: 15px; background: rgba(255,255,255,0.5); }

    /* Print Styles (Sarabun font for official statistics) */
    @media print {
      body * { visibility: hidden !important; }
      #printReportArea, #printReportArea * { visibility: visible !important; }
      #printReportArea {
        position: fixed; left: 0; top: 0; width: 100%; height: 100%;
        background: white !important; color: black !important;
        font-family: 'Sarabun', sans-serif !important;
        padding: 20px; z-index: 999999;
      }
    }
  </style>
</head>
<body>

<!-- พื้นที่สำหรับพิมพ์รายงานสถิติ (Sarabun) -->
<div id="printReportArea" style="display:none;"></div>

<!-- ================= PIN LOCK OVERLAY ================= -->
<div id="pinOverlay">
  <div class="pin-card">
    <img src="https://i.postimg.cc/T2Cngdnd/Financial.png" alt="logo" style="width:64px; height:64px; border-radius:16px; margin-bottom:8px; box-shadow:0 4px 10px rgba(0,0,0,0.1);">
    <h3 style="margin:0 0 4px 0; color:#d63384; font-size:18px;">ระบบบันทึกการใช้เงิน</h3>
    <p id="pinMsg" style="margin:0 0 16px 0; color:#666; font-size:13px;">กรุณากรอกรหัส PIN 4 หลัก</p>
    
    <div style="display:flex; justify-content:center; gap:14px; margin-bottom:18px;">
      <span class="pin-dot" id="dot-0"></span>
      <span class="pin-dot" id="dot-1"></span>
      <span class="pin-dot" id="dot-2"></span>
      <span class="pin-dot" id="dot-3"></span>
    </div>
    
    <div class="pin-keypad">
      <button class="pin-key" onclick="pressPin('1')">1</button>
      <button class="pin-key" onclick="pressPin('2')">2</button>
      <button class="pin-key" onclick="pressPin('3')">3</button>
      <button class="pin-key" onclick="pressPin('4')">4</button>
      <button class="pin-key" onclick="pressPin('5')">5</button>
      <button class="pin-key" onclick="pressPin('6')">6</button>
      <button class="pin-key" onclick="pressPin('7')">7</button>
      <button class="pin-key" onclick="pressPin('8')">8</button>
      <button class="pin-key" onclick="pressPin('9')">9</button>
      <button class="pin-key pin-tool" onclick="promptChangePin()" title="เปลี่ยนรหัส PIN">⚙️</button>
      <button class="pin-key" onclick="pressPin('0')">0</button>
      <button class="pin-key pin-tool" onclick="deletePin()">⌫</button>
    </div>
  </div>
</div>

<div class="app-container">
  
  <!-- Header Bar: หัวข้อแอป (ไม่มีไอคอน 4 ปุ่มแล้ว) -->
  <div class="header-bar">
    <div class="header-brand">
      <img src="https://i.postimg.cc/T2Cngdnd/Financial.png" alt="logo" class="header-logo">
      <h1 class="header-title">ระบบบันทึกการใช้เงิน</h1>
    </div>
  </div>

  <div id="loader">✨ กำลังโหลดข้อมูล...</div>

  <!-- ส่วนบันทึกรายการ (หน้าจอหลัก - พอดีจอ ไม่ต้องเลื่อน) -->
  <div class="glass">
    
    <!-- ช่องเลือกวันที่ พ.ศ. -->
    <div class="form-group">
      <label>📅 วันที่ทำรายการ (พ.ศ.)</label>
      <div class="date-picker-wrap">
        <input type="text" id="dateDisplay" readonly placeholder="วว/ดด/ปปปป" onclick="openDatePicker()" title="คลิกเพื่อเลือกวันที่" style="cursor:pointer; text-align:center; background:#ffffff; font-weight:600; color:#5a2e5d;">
        <input type="date" id="dateRaw" onchange="onDateChange(this.value)">
      </div>
    </div>

    <!-- ปุ่มเลือกหมวดหมู่ (แนวนอนบรรทัดเดียว) -->
    <div class="form-group">
      <div class="field-header">
        <label>📁 เลือกหมวดหมู่</label>
        <button type="button" class="btn-icon-mini" onclick="promptAddCategory()">➕ เพิ่มหมวด</button>
      </div>
      <div id="categoryChips" class="chips-container-row"></div>
    </div>
    
    <!-- ปุ่มเลือกผู้ทำรายการ (แนวนอนบรรทัดเดียว) -->
    <div class="form-group">
      <div class="field-header">
        <label>👤 ผู้ทำรายการ</label>
        <button type="button" class="btn-icon-mini" onclick="promptAddStudent()">➕ เพิ่มคน</button>
      </div>
      <div id="studentChips" class="chips-container-row"></div>
    </div>
    
    <div class="form-group">
      <label>💵 จำนวนเงิน (บาท)</label>
      <input type="number" id="amountInput" inputmode="numeric" pattern="[0-9]*" placeholder="ระบุจำนวนเงิน" min="1">
    </div>
    
    <div class="form-group">
      <label>💬 หมายเหตุ (ถ้ามี)</label>
      <input type="text" id="remarkInput" placeholder="เช่น ค่าอาหาร, ฝากเงิน, ซื้อของ">
    </div>
    
    <div class="action-row">
      <button class="btn btn-deposit" onclick="submitTransaction('ฝาก')">+ ฝากเงิน</button>
      <button class="btn btn-withdraw" onclick="submitTransaction('ถอน')">- ถอนเงิน</button>
    </div>
  </div>

  <!-- แถบปุ่มด้านล่างสุด (ย้าย 3 ปุ่มลงมาที่นี่) -->
  <div class="bottom-dock">
    <button class="dock-btn" onclick="openModal('balanceModal')">
      <span class="dock-icon">📊</span>
      <span class="dock-label">เช็คยอด</span>
    </button>
    <button class="dock-btn" onclick="openModal('recentModal')">
      <span class="dock-icon">🕒</span>
      <span class="dock-label">ล่าสุด</span>
    </button>
    <button class="dock-btn" onclick="lockScreen()">
      <span class="dock-icon">🔒</span>
      <span class="dock-label">ล็อค PIN</span>
    </button>
  </div>

</div>

<!-- ================= MODALS ================= -->

<!-- 1. Modal เช็คยอดคงเหลือ พร้อมปุ่มพิมพ์สถิติ -->
<div id="balanceModal" class="modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeModal('balanceModal')">&times;</span>
    <h3 style="margin-bottom:8px;">📊 เช็คยอดคงเหลือ</h3>
    
    <div class="form-group">
      <label>เลือกหมวดหมู่:</label>
      <div id="checkCategoryChips" class="chips-container-row" style="margin-top:4px;"></div>
    </div>
    
    <div id="balanceListResult" style="margin-top:10px; max-height:220px; overflow-y:auto;"></div>

    <!-- ปุ่มพิมพ์สถิติประจำหมวดหมู่ -->
    <button class="btn" onclick="printCategoryStats()" style="margin-top:10px; background:#4facfe; color:white; font-size:13.5px; padding:9px;">
      🖨️ พิมพ์รายงานสถิติหมวดหมู่นี้
    </button>
  </div>
</div>

<!-- 2. Modal 10 รายการล่าสุด -->
<div id="recentModal" class="modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeModal('recentModal')">&times;</span>
    <h3>🕒 10 รายการล่าสุด</h3>
    <div id="recentTransactionsResult" style="max-height:320px; overflow-y:auto;"></div>
  </div>
</div>

<!-- 3. Modal ประวัติรายบุคคล -->
<div id="historyModal" class="modal" style="z-index: 105;">
  <div class="modal-content">
    <span class="close-btn" onclick="closeModal('historyModal')">&times;</span>
    <h3 id="historyTitle" style="font-size:17px; margin-bottom:4px;">ประวัติ</h3>
    <div style="text-align:center; color:#666; font-size:13px; margin-bottom:10px;" id="historySubtitle"></div>
    <div id="historyListResult" style="max-height:300px; overflow-y:auto;"></div>
  </div>
</div>

<!-- ================= SCRIPTS ================= -->
<script>
  // ==========================================
  // ข้อมูลตั้งต้นจริงจาก Google Sheets (โหลดทันที 0ms ไม่มีค้าง)
  // ==========================================
  const INITIAL_REAL_DATA = {

  // ==========================================
  // 1. PIN LOCK SYSTEM
  // ==========================================
  let currentEnteredPin = "";
  const PIN_STORAGE_KEY = 'financial_app_pin_v1';
  const UNLOCKED_KEY = 'financial_app_unlocked';

  function getSavedPin() {
    return localStorage.getItem(PIN_STORAGE_KEY) || "1234";
  }

  function checkLockState() {
    if (sessionStorage.getItem(UNLOCKED_KEY) === 'true') {
      document.getElementById('pinOverlay').style.display = 'none';
    } else {
      document.getElementById('pinOverlay').style.display = 'flex';
      currentEnteredPin = "";
      updatePinDots();
    }
  }

  function pressPin(num) {
    if (currentEnteredPin.length < 4) {
      currentEnteredPin += num;
      updatePinDots();
      if (currentEnteredPin.length === 4) {
        setTimeout(verifyPin, 100);
      }
    }
  }

  function deletePin() {
    if (currentEnteredPin.length > 0) {
      currentEnteredPin = currentEnteredPin.slice(0, -1);
      updatePinDots();
    }
  }

  function updatePinDots() {
    for (let i = 0; i < 4; i++) {
      const dot = document.getElementById('dot-' + i);
      if (i < currentEnteredPin.length) {
        dot.classList.add('filled');
      } else {
        dot.classList.remove('filled');
      }
    }
  }

  function verifyPin() {
    const correctPin = getSavedPin();
    if (currentEnteredPin === correctPin) {
      sessionStorage.setItem(UNLOCKED_KEY, 'true');
      document.getElementById('pinOverlay').style.display = 'none';
      currentEnteredPin = "";
    } else {
      const msg = document.getElementById('pinMsg');
      msg.innerText = "❌ รหัส PIN ไม่ถูกต้อง";
      msg.style.color = "#ff4d4f";
      currentEnteredPin = "";
      updatePinDots();
      setTimeout(() => {
        msg.innerText = "กรุณากรอกรหัส PIN 4 หลัก";
        msg.style.color = "#666";
      }, 1500);
    }
  }

  function promptChangePin() {
    const oldPin = prompt("กรุณาระบุรหัส PIN ปัจจุบัน:");
    if (oldPin === getSavedPin()) {
      const newPin = prompt("กรุณากำหนดรหัส PIN 4 หลักใหม่ (เฉพาะตัวเลข):");
      if (newPin && newPin.length === 4 && /^\d+$/.test(newPin)) {
        localStorage.setItem(PIN_STORAGE_KEY, newPin);
        alert("✅ เปลี่ยนรหัส PIN สำเร็จ!");
      } else {
        alert("⚠️ รหัส PIN ต้องเป็นตัวเลข 4 หลักเท่านั้น");
      }
    } else if (oldPin !== null) {
      alert("❌ รหัส PIN เดิมไม่ถูกต้อง");
    }
  }

  function lockScreen() {
    sessionStorage.removeItem(UNLOCKED_KEY);
    checkLockState();
  }

  // ==========================================
  // 2. GAS API Bridge (URL ฝังถาวรในระบบ ไม่ต้องตั้งค่า)
  // ==========================================
  const GAS_URL = "https://script.google.com/macros/s/AKfycbyE1fW25SF41sBaOCilsKbBA67LPtE588IU768FYpsoZtU2CW9MFnTDb22bM-CysyM_/exec";

  function createGasProxy(successFn, failureFn) {
    const runner = {
      successFn: successFn || function() {},
      failureFn: failureFn || function(err) {
        console.warn("GAS Sync Warning:", err);
        showLoader(false);
      },
      withSuccessHandler: function(fn) {
        return createGasProxy(fn, this.failureFn);
      },
      withFailureHandler: function(fn) {
        return createGasProxy(this.successFn, fn);
      }
    };

    return new Proxy(runner, {
      get: function(target, prop) {
        if (prop in target) {
          return target[prop];
        }
        return function(...args) {
          const encodedArgs = encodeURIComponent(JSON.stringify(args));
          const getUrl = `${GAS_URL}?action=${encodeURIComponent(prop)}&args=${encodedArgs}`;

          fetch(getUrl)
            .then(res => {
              if (!res.ok) throw new Error("HTTP " + res.status);
              return res.json();
            })
            .then(data => {
              showLoader(false);
              if (data && data.error) {
                target.failureFn(new Error(data.error));
              } else {
                target.successFn(data);
              }
            })
            .catch(err => {
              fetch(GAS_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: prop, args: args })
              })
              .then(res => res.json())
              .then(data => {
                showLoader(false);
                if (data && data.error) {
                  target.failureFn(new Error(data.error));
                } else {
                  target.successFn(data);
                }
              })
              .catch(postErr => {
                showLoader(false);
                target.failureFn(postErr);
              });
            });
        };
      }
    });
  }

  if (!window.google || !window.google.script || !window.google.script.run) {
    window.google = window.google || {};
    window.google.script = window.google.script || {};
    window.google.script.run = createGasProxy();
  }

  // ==========================================
  // 3. UI STATE & RENDERING
  // ==========================================
  let globalStudents = [];
  let globalBalances = {};
  let globalCategories = [];
  let globalRecent = [];
  let selectedCategory = "";
  let selectedStudent = "";
  let checkSelectedCat = "";

  const CACHE_KEY = "financial_dashboard_cache_v3";

  window.onload = function() {
    checkLockState();
    initDefaultDate();
    
    // 1. โหลดข้อมูลแคชหรือข้อมูลเริ่มต้นทันที 0ms เพื่อให้กดเลือกหมวดหมู่ได้ทันที
    const cached = localStorage.getItem(CACHE_KEY);
    const initialData = cached ? JSON.parse(cached) : INITIAL_REAL_DATA;
    updateUI(initialData);

    // 2. ดึงข้อมูลสดจาก Google Sheets ในเบื้องหลัง
    google.script.run
      .withSuccessHandler(data => {
        showLoader(false);
        if (data && data.categories && data.categories.length > 0) {
          localStorage.setItem(CACHE_KEY, JSON.stringify(data));
          updateUI(data);
        }
      })
      .withFailureHandler(err => {
        showLoader(false);
      })
      .getDashboardData();
  };

  function initDefaultDate() {
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    
    const isoDate = `${yyyy}-${mm}-${dd}`;
    document.getElementById('dateRaw').value = isoDate;
    updateDateDisplay(dd, mm, yyyy + 543);
  }

  function onDateChange(isoVal) {
    if (!isoVal) return;
    const parts = isoVal.split('-');
    if (parts.length === 3) {
      const yearBE = parseInt(parts[0], 10) + 543;
      updateDateDisplay(parts[2], parts[1], yearBE);
    }
  }

  function updateDateDisplay(dd, mm, yyyyBE) {
    document.getElementById('dateDisplay').value = `${dd}/${mm}/${yyyyBE}`;
  }

  function openDatePicker() {
    const rawPicker = document.getElementById('dateRaw');
    if (rawPicker.showPicker) {
      try { rawPicker.showPicker(); } catch (e) { rawPicker.focus(); }
    } else {
      rawPicker.focus();
    }
  }

  function showLoader(show) {
    document.getElementById('loader').style.display = show ? 'block' : 'none';
  }

  function openModal(id) { document.getElementById(id).style.display = 'block'; }
  function closeModal(id) { document.getElementById(id).style.display = 'none'; }

  function updateUI(data) {
    if (!data) return;
    
    globalStudents = data.students || [];
    globalBalances = data.balances || {};
    globalCategories = data.categories || [];
    globalRecent = data.recent || [];

    renderCategoryChips();
    renderCheckCategoryChips();
    renderRecentTransactions(globalRecent);
  }

  // เรนเดอร์ปุ่มหมวดหมู่ (Chips แนวนอน)
  function renderCategoryChips() {
    const container = document.getElementById('categoryChips');
    if (!globalCategories || globalCategories.length === 0) {
      container.innerHTML = '<div style="font-size:12px; color:#666;">ยังไม่มีหมวดหมู่</div>';
      return;
    }

    if (!selectedCategory || !globalCategories.includes(selectedCategory)) {
      selectedCategory = globalCategories[0];
    }

    let html = '';
    globalCategories.forEach(cat => {
      const activeClass = (cat === selectedCategory) ? 'active' : '';
      html += `<button type="button" class="chip-btn ${activeClass}" onclick="selectCategory('${cat}')">${cat}</button>`;
    });
    container.innerHTML = html;

    renderStudentChips();
  }

  function selectCategory(cat) {
    selectedCategory = cat;
    renderCategoryChips();
  }

  // เรนเดอร์ปุ่มผู้ทำรายการ (Chips แนวนอน)
  function renderStudentChips() {
    const container = document.getElementById('studentChips');
    if (!selectedCategory) {
      container.innerHTML = '<div style="font-size:12px; color:#777;">- กรุณาเลือกหมวดหมู่ก่อน -</div>';
      return;
    }

    const filtered = globalStudents.filter(s => s.category === selectedCategory);
    if (filtered.length === 0) {
      container.innerHTML = '<div style="font-size:12px; color:#777;">ยังไม่มีผู้ทำรายการในหมวดนี้</div>';
      selectedStudent = "";
      return;
    }

    const exists = filtered.some(s => s.name === selectedStudent);
    if (!exists) {
      selectedStudent = filtered[0].name;
    }

    let html = '';
    filtered.forEach(s => {
      const activeClass = (s.name === selectedStudent) ? 'active' : '';
      html += `<button type="button" class="chip-btn ${activeClass}" onclick="selectStudent('${s.name}')">${s.name}</button>`;
    });
    container.innerHTML = html;
  }

  function selectStudent(name) {
    selectedStudent = name;
    renderStudentChips();
  }

  // เรนเดอร์ Chips ใน Modal เช็คยอด
  function renderCheckCategoryChips() {
    const container = document.getElementById('checkCategoryChips');
    if (!globalCategories || globalCategories.length === 0) {
      container.innerHTML = '<div style="font-size:12px; color:#777;">ไม่มีหมวดหมู่</div>';
      return;
    }

    if (!checkSelectedCat || !globalCategories.includes(checkSelectedCat)) {
      checkSelectedCat = globalCategories[0];
    }

    let html = '';
    globalCategories.forEach(cat => {
      const activeClass = (cat === checkSelectedCat) ? 'active' : '';
      html += `<button type="button" class="chip-btn ${activeClass}" onclick="selectCheckCategory('${cat}')">${cat}</button>`;
    });
    container.innerHTML = html;
    renderBalanceList();
  }

  function selectCheckCategory(cat) {
    checkSelectedCat = cat;
    renderCheckCategoryChips();
  }

  function renderBalanceList() {
    const resultDiv = document.getElementById('balanceListResult');
    if (!checkSelectedCat) {
      resultDiv.innerHTML = '<div style="text-align:center; color:#555; padding:8px;">กรุณาเลือกหมวดหมู่</div>';
      return;
    }

    const studentsInCat = globalStudents.filter(s => s.category === checkSelectedCat);
    if (studentsInCat.length === 0) {
      resultDiv.innerHTML = '<div style="text-align:center; color:#555; padding:8px;">ไม่มีผู้ทำรายการในหมวดนี้</div>';
      return;
    }

    let html = '';
    studentsInCat.forEach(s => {
      const balKey = `${s.name} (${checkSelectedCat})`;
      const bal = globalBalances[balKey] || 0;
      html += `
        <div class="balance-box">
          <div class="balance-name">${s.name}</div>
          <div class="balance-amount">${bal.toLocaleString()} ฿</div>
          <button class="btn-icon-mini" onclick="viewHistory('${s.name}', '${checkSelectedCat}')" style="background:#e0f2fe; color:#0369a1; border:none; padding:3px 9px;">ประวัติ</button>
        </div>`;
    });
    resultDiv.innerHTML = html;
  }

  function renderRecentTransactions(recent) {
    let recentHtml = '';
    if (!recent || recent.length === 0) {
      recentHtml = '<div style="text-align:center; color:#666; padding:15px;">ยังไม่มีรายการบันทึก</div>';
    } else {
      recent.forEach(r => {
        const isDeposit = (r.type === 'ฝาก' || r.type === 'รายรับ');
        const colorClass = isDeposit ? 't-deposit' : 't-withdraw';
        const sign = isDeposit ? '+' : '-';
        recentHtml += `
          <div class="transaction-item">
            <div class="t-info">
              <strong>${r.student}</strong> (${r.category})<br>
              <span style="color:#666; font-size:11px;">${r.time} | ${r.remark || '-'}</span>
            </div>
            <div style="text-align:right;">
              <div class="t-amount ${colorClass}">${sign}${Number(r.amount).toLocaleString()} ฿</div>
              <button class="btn-icon-mini" onclick="deleteItem('${r.id}')" style="background:#fee2e2; color:#ef4444; border:none; margin-top:2px;">ลบ</button>
            </div>
          </div>`;
      });
    }
    document.getElementById('recentTransactionsResult').innerHTML = recentHtml;
  }

  function viewHistory(studentName, category) {
    document.getElementById('historyTitle').innerText = studentName;
    document.getElementById('historySubtitle').innerText = `หมวดหมู่: ${category}`;
    document.getElementById('historyListResult').innerHTML = '<div style="text-align:center; padding:10px;">กำลังโหลด...</div>';
    
    openModal('historyModal');

    google.script.run.withSuccessHandler(history => {
      let html = '';
      if (!history || history.length === 0) {
        html = '<div style="text-align:center; color:#666; padding:12px;">ไม่พบประวัติการทำรายการ</div>';
      } else {
        history.forEach(r => {
          const isDeposit = (r.type === 'ฝาก' || r.type === 'รายรับ');
          const colorClass = isDeposit ? 't-deposit' : 't-withdraw';
          const sign = isDeposit ? '+' : '-';
          html += `
            <div class="transaction-item">
              <div class="t-info">
                <strong>${r.type}</strong> (${Number(r.amount).toLocaleString()} ฿)<br>
                <span style="color:#666; font-size:11px;">${r.time} | ${r.remark || '-'}</span>
              </div>
              <div style="text-align:right;">
                <div class="t-amount ${colorClass}">${sign}${Number(r.amount).toLocaleString()} ฿</div>
                <button class="btn-icon-mini" onclick="deleteItem('${r.id}', true)" style="background:#fee2e2; color:#ef4444; border:none;">ลบ</button>
              </div>
            </div>`;
        });
      }
      document.getElementById('historyListResult').innerHTML = html;
    }).getStudentHistory(studentName, category);
  }

  function submitTransaction(type) {
    const category = selectedCategory;
    const student = selectedStudent;
    const amount = document.getElementById('amountInput').value;
    const remark = document.getElementById('remarkInput').value;
    const chosenDate = document.getElementById('dateRaw').value;

    if (!category) {
      alert('⚠️ กรุณาเลือกหมวดหมู่');
      return;
    }
    if (!student) {
      alert('⚠️ กรุณาเลือกผู้ทำรายการ (หรือกด ➕ เพิ่มคน)');
      return;
    }
    if (!amount || Number(amount) <= 0) {
      alert('⚠️ กรุณาระบุจำนวนเงิน');
      return;
    }

    showLoader(true);
    google.script.run.withSuccessHandler(res => {
      showLoader(false);
      localStorage.setItem(CACHE_KEY, JSON.stringify(res));
      updateUI(res);
      document.getElementById('amountInput').value = '';
      document.getElementById('remarkInput').value = '';
      alert(`✅ บันทึกรายการ ${type} สำเร็จ!`);
    }).addTransaction(student, category, type, amount, remark, chosenDate);
  }

  function deleteItem(id, fromHistoryModal = false) {
    if (confirm('❓ แน่ใจหรือไม่ว่าต้องการลบรายการนี้?')) {
      showLoader(true);
      google.script.run.withSuccessHandler(res => {
        showLoader(false);
        localStorage.setItem(CACHE_KEY, JSON.stringify(res));
        updateUI(res);
        if (fromHistoryModal) closeModal('historyModal'); 
      }).deleteTransaction(id);
    }
  }

  function promptAddStudent() {
    if (!selectedCategory) {
      alert('⚠️ กรุณาเลือกหมวดหมู่ก่อน');
      return;
    }
    const name = prompt(`กรอกชื่อผู้ทำรายการใหม่ ในหมวดหมู่ "${selectedCategory}":`);
    if (name && name.trim()) { 
      showLoader(true); 
      google.script.run.withSuccessHandler(res => {
        showLoader(false);
        selectedStudent = name.trim();
        localStorage.setItem(CACHE_KEY, JSON.stringify(res));
        updateUI(res);
      }).addStudent(name.trim(), selectedCategory); 
    }
  }

  function promptAddCategory() {
    const cat = prompt("กรอกชื่อหมวดหมู่ที่ต้องการเพิ่ม:");
    if (cat && cat.trim()) { 
      showLoader(true); 
      google.script.run.withSuccessHandler(res => {
        showLoader(false);
        selectedCategory = cat.trim();
        localStorage.setItem(CACHE_KEY, JSON.stringify(res));
        updateUI(res);
      }).addCategory(cat.trim()); 
    }
  }

  // ==========================================
  // 4. พิมพ์รายงานสถิติ (Sarabun Font)
  // ==========================================
  function printCategoryStats() {
    if (!checkSelectedCat) {
      alert("กรุณาเลือกหมวดหมู่ก่อนพิมพ์");
      return;
    }

    const studentsInCat = globalStudents.filter(s => s.category === checkSelectedCat);
    const dateText = document.getElementById('dateDisplay').value;
    let totalCatBalance = 0;

    let rowsHtml = '';
    studentsInCat.forEach((s, idx) => {
      const balKey = `${s.name} (${checkSelectedCat})`;
      const bal = globalBalances[balKey] || 0;
      totalCatBalance += bal;
      rowsHtml += `
        <tr>
          <td style="border:1px solid #333; padding:8px; text-align:center;">${idx + 1}</td>
          <td style="border:1px solid #333; padding:8px;">${s.name}</td>
          <td style="border:1px solid #333; padding:8px; text-align:right;">${bal.toLocaleString()} บาท</td>
        </tr>`;
    });

    const reportHtml = `
      <div style="font-family:'Sarabun', sans-serif; padding:10px; color:#000;">
        <h2 style="text-align:center; margin:0 0 5px 0;">รายงานสถิติยอดเงินคงเหลือ</h2>
        <h3 style="text-align:center; margin:0 0 15px 0; font-weight:normal;">หมวดหมู่: <strong>${checkSelectedCat}</strong> | ข้อมูล ณ วันที่: ${dateText}</h3>
        <table style="width:100%; border-collapse:collapse; margin-bottom:15px; font-size:14px;">
          <thead>
            <tr style="background:#f2f2f2;">
              <th style="border:1px solid #333; padding:8px; width:60px;">ลำดับ</th>
              <th style="border:1px solid #333; padding:8px; text-align:left;">ชื่อผู้ทำรายการ</th>
              <th style="border:1px solid #333; padding:8px; text-align:right; width:150px;">ยอดเงินคงเหลือ</th>
            </tr>
          </thead>
          <tbody>
            ${rowsHtml || '<tr><td colspan="3" style="text-align:center; padding:10px;">ไม่มีข้อมูล</td></tr>'}
          </tbody>
          <tfoot>
            <tr style="font-weight:bold; background:#fafafa;">
              <td colspan="2" style="border:1px solid #333; padding:8px; text-align:right;">ยอดเงินรวมทั้งสิ้น:</td>
              <td style="border:1px solid #333; padding:8px; text-align:right;">${totalCatBalance.toLocaleString()} บาท</td>
            </tr>
          </tfoot>
        </table>
        <div style="text-align:right; font-size:12px; margin-top:30px;">
          <p>ลงชื่อ .............................................................. ผู้จัดทำรายงาน</p>
          <p>วันที่พิมพ์: ${dateText}</p>
        </div>
      </div>
    `;

    const printArea = document.getElementById('printReportArea');
    printArea.innerHTML = reportHtml;
    printArea.style.display = 'block';
    window.print();
    printArea.style.display = 'none';
  }

  // PWA Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js?v=4').then(reg => {
        reg.update();
      }).catch(() => {});
    });
  }
</script>
